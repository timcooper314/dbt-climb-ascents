version: 2

models:
  - name: stg_climbers
    description: '{{ doc("climbers") }}'
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
        description: The primary key for stg_climbers
      - name: country
      - name: sex
      - name: height
      - name: weight
      - name: birthdate
  - name: stg_routes
    description: Raw details of climbing routes, including their location and grade.
    columns:
      - name: route_id
        data_tests:
          - unique
          - not_null
        description: The primary key for stg_routes
      - name: country
      - name: crag
      - name: sector
      - name: name
      - name: tall_recommend_sum
      - name: grade_mean
      - name: cluster
      - name: rating_tot
  - name: stg_grades_ref
    description: Reference data mapping French grades to a numeric scale.
    columns:
      - name: grade_id
        data_tests:
          - unique
          - not_null
      - name: grade_fra
  - name: stg_ascents
    description: Raw data about route ascents.
    columns:
      - name: ascent_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
      - name: route_id
        data_tests:
          - not_null
      - name: ascent_date
        data_tests:
          - assert_ascent_date_in_past
